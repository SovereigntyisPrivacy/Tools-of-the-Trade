name: Android Build & Sign

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies and Build Web
        run: |
          npm install
          npm run build

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Grant Execute Permission for Gradle
        run: cd android && chmod +x gradlew

      - name: Build Release APK
        run: |
          cd android
          ./gradlew assembleRelease

      - name: Sign Release APK
        run: |
          # 1. Decode the Keystore secret into a usable file
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/release.keystore
          
          # 2. Find the newest Android Build Tools automatically
          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          
          # 3. Find the unsigned APK that Gradle just built
          APK_IN=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          
          # 4. Align and Sign the APK
          $BUILD_TOOLS/zipalign -v -p 4 "$APK_IN" android/app/build/outputs/apk/release/aligned.apk
          $BUILD_TOOLS/apksigner sign --ks android/app/release.keystore \
            --ks-key-alias "${{ secrets.KEYSTORE_ALIAS }}" \
            --ks-pass "pass:${{ secrets.KEYSTORE_PASSWORD }}" \
            --key-pass "pass:${{ secrets.KEYSTORE_PASSWORD }}" \
            --out android/app/build/outputs/apk/release/ToolsOfTheTrade-Signed.apk \
            android/app/build/outputs/apk/release/aligned.apk

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: ToolsOfTheTrade-Signed-APK
          path: android/app/build/outputs/apk/release/ToolsOfTheTrade-Signed.apk
